name: WorkBuddy Daily Checkin

# GitHub Actions 用的是 UTC 时间，换算关系：北京时间 - 8 小时 = UTC
#   北京时间 09:30（早晨：签到 + 领旧奖 + 派猫）→ UTC 01:30
#   北京时间 14:00（下午：领奖）              → UTC 06:00
on:
  schedule:
    - cron: '30 1 * * *'
    - cron: '0 6 * * *'
  workflow_dispatch:        # 允许在 Actions 页面手动点一下试跑

permissions:
  contents: read

jobs:
  checkin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 同一个 workflow 里区分早晨 / 下午：UTC 01:30 跑早晨例行，UTC 06:00 跑下午领奖
      # 早晨：--all = 签到 + 领旧奖 + 派猫 + 对话打卡 + 成长任务 + 抽奖 + 连登兑换
      # 下午：--afternoon --chat = 领奖 + 再补一次对话打卡
      # 对话打卡走 WebChat 通道（纯 token 建真实会话），不依赖客户端在线，CI 可直接跑
      - name: 选择执行模式
        id: mode
        run: |
          HOUR=$(date -u +%H)
          if [ "$HOUR" -lt 4 ]; then
            echo "arg=--all" >> "$GITHUB_OUTPUT"
          else
            echo "arg=--afternoon --chat" >> "$GITHUB_OUTPUT"
          fi

      # token 只能从 Secrets 读，千万不要写进代码或 tokens.txt 提交上去。
      # 在仓库 Settings → Secrets and variables → Actions 里添加 WB_TOKEN_1 / WB_TOKEN_2 / WB_TOKEN_3，
      # 想加更多账号就继续加 WB_TOKEN_4 ... 脚本会自动按序号全部读取。
      #
      # ⚠️ CI 无法自己续期（云端没有桌面端登录态，OAuth refresh 又需要客户端密钥）。
      #    所以这里只做「提前告警」：token 剩余 <7 天就让本步骤失败，
      #    GitHub 会给失败的定时任务发邮件 —— 等于零配置的到期提醒。
      #    真正续期由装了桌面端的机器执行：refresh_tokens.py --push-github=owner/repo
      - name: 检查 token 有效期
        env:
          WB_TOKEN_1: ${{ secrets.WB_TOKEN_1 }}
          WB_TOKEN_2: ${{ secrets.WB_TOKEN_2 }}
          WB_TOKEN_3: ${{ secrets.WB_TOKEN_3 }}
        run: python scripts/auto_daily.py --check-expiry=7

      - name: 执行每日任务 + 生成日报推送
        env:
          WB_TOKEN_1: ${{ secrets.WB_TOKEN_1 }}
          WB_TOKEN_2: ${{ secrets.WB_TOKEN_2 }}
          WB_TOKEN_3: ${{ secrets.WB_TOKEN_3 }}
          # 微信推送（Server酱 sendkey）。不配置就不推送、只写日志，不影响任务本身。
          # 在仓库 Settings → Secrets and variables → Actions 里加 SCT_SENDKEY。
          # 也可以改用 PushPlus：加 PUSHPLUS_TOKEN 即可（两个都配会各推一次）。
          SCT_SENDKEY: ${{ secrets.SCT_SENDKEY }}
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
        run: |
          python scripts/auto_daily.py ${{ steps.mode.outputs.arg }} 2>&1 | tee run.log
          python scripts/report.py run.log
