name: WorkBuddy Daily Checkin

# GitHub Actions 用的是 UTC 时间，换算关系：北京时间 - 8 小时 = UTC
#   北京时间 06:00（早晨：签到 + 领旧奖 + 派猫）→ UTC 22:00（前一天）
#   北京时间 14:00（下午：领奖）              → UTC 06:00
on:
  schedule:
    - cron: '0 22 * * *'
    - cron: '0 6 * * *'
  workflow_dispatch:        # 允许在 Actions 页面手动点一下试跑
    inputs:
      mode:
        description: '执行模式（auto = 按触发时间自动判断）'
        required: false
        default: 'auto'
        type: choice
        options:
          - auto
          - morning
          - afternoon
      push:
        description: '是否推送到微信（false = 只生成日报并打到日志，不消耗 Server酱 每日额度）'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

permissions:
  contents: read

jobs:
  checkin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 按【事件来源】区分早晨 / 下午，不再用「触发时的小时」判断：
      #   GitHub Actions 的 schedule 常延迟数小时，按当前小时会把早晨档误判成下午档（漏跑签到）。
      #   cron '0 22 * * *' = UTC 22:00 = 北京 06:00 → 早晨 --all
      #   cron '0 6 * * *'  = UTC 06:00 = 北京 14:00 → 下午 --afternoon --chat
      # 手动触发(workflow_dispatch)用 inputs.mode 强制指定；其余按北京时间兜底。
      # 对话打卡走 WebChat 通道（纯 token 建真实会话），不依赖客户端在线，CI 可直接跑
      - name: 选择执行模式
        id: mode
        env:
          SCHEDULE_CRON: ${{ github.event.schedule }}
          INPUT_MODE: ${{ github.event.inputs.mode }}
        run: |
          if [ "$INPUT_MODE" = "morning" ]; then
            ARG="--all"
          elif [ "$INPUT_MODE" = "afternoon" ]; then
            ARG="--afternoon --chat"
          elif [ -n "$SCHEDULE_CRON" ]; then
            case "$SCHEDULE_CRON" in
              "0 22 * * *") ARG="--all" ;;
              "0 6 * * *")  ARG="--afternoon --chat" ;;
              *)            ARG="--all" ;;
            esac
          else
            BEIJING_HOUR=$(( ($(date -u +%H) + 8) % 24 ))
            if [ "$BEIJING_HOUR" -ge 6 ] && [ "$BEIJING_HOUR" -lt 12 ]; then
              ARG="--all"
            else
              ARG="--afternoon --chat"
            fi
          fi
          echo "arg=$ARG" >> "$GITHUB_OUTPUT"
          echo "selected arg=$ARG (cron=${SCHEDULE_CRON:-none}, input=${INPUT_MODE:-auto})"

      # token 只能从 Secrets 读，千万不要写进代码或 tokens.txt 提交上去。
      # 在仓库 Settings → Secrets and variables → Actions 里添加 WB_TOKEN_1 / WB_TOKEN_2 / WB_TOKEN_3，
      # 想加更多账号就继续加 WB_TOKEN_4 ... 脚本会自动按序号全部读取。
      #
      # ⚠️ CI 无法自己续期（云端没有桌面端登录态，OAuth refresh 又需要客户端密钥）。
      #    所以这里只做「提前告警」：token 剩余 <7 天就让本步骤失败，
      #    GitHub 会给失败的定时任务发邮件 —— 等于零配置的到期提醒。
      #    真正续期由装了桌面端的机器执行：refresh_tokens.py --push-github=owner/repo
      - name: 检查 token 有效期
        env:
          WB_TOKEN_1: ${{ secrets.WB_TOKEN_1 }}
          WB_TOKEN_2: ${{ secrets.WB_TOKEN_2 }}
          WB_TOKEN_3: ${{ secrets.WB_TOKEN_3 }}
          WB_TOKEN_4: ${{ secrets.WB_TOKEN_4 }}
          WB_TOKEN_5: ${{ secrets.WB_TOKEN_5 }}
        run: python scripts/auto_daily.py --check-expiry=3

      - name: 执行每日任务 + 生成日报
        env:
          WB_TOKEN_1: ${{ secrets.WB_TOKEN_1 }}
          WB_TOKEN_2: ${{ secrets.WB_TOKEN_2 }}
          WB_TOKEN_3: ${{ secrets.WB_TOKEN_3 }}
          WB_TOKEN_4: ${{ secrets.WB_TOKEN_4 }}
          WB_TOKEN_5: ${{ secrets.WB_TOKEN_5 }}
          # 微信推送（Server酱 sendkey）。不配置就不推送、只写日志，不影响任务本身。
          # 在仓库 Settings → Secrets and variables → Actions 里加 SCT_SENDKEY。
          # 也可以改用 PushPlus：加 PUSHPLUS_TOKEN 即可（两个都配会各推一次）。
          # push=false（手动触发时可选）时不推送，只把日报打到日志，避免消耗每日推送额度。
          SCT_SENDKEY: ${{ secrets.SCT_SENDKEY }}
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          WB_NO_PUSH: ${{ github.event.inputs.push == 'false' && '1' || '' }}
        run: |
          python scripts/auto_daily.py ${{ steps.mode.outputs.arg }} 2>&1 | tee run.log
          python scripts/report.py run.log
